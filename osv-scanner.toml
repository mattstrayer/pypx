# Nuxt false positives. GitHub's advisories bound the unpatched 3.x range at
# <4.0.0, but GitHub's OSV export cannot express an upper bound with no fixed
# version. It emits an open range (introduced: 3.0.0) and moves "< 4.0.0" to
# database_specific.last_known_affected_version_range, which osv-scanner
# ignores. So every version >= 3.0.0 matches, including the patched 4.x
# release. Upstream: github/advisory-database#470, google/osv.dev#474.
# Remove each entry once its OSV record carries last_affected for 3.x.

