                  - listitem [ref=e124]: write grant proposals and help with other fundraising efforts
                - paragraph [ref=e125]:
                  - text: For more information about the ways you can contribute to NumPy, visit
                  - link "our website" [ref=e126] [cursor=pointer]:
                    - /url: https://numpy.org/contribute/
                  - text: . If you’re unsure where to start or how your skills fit in, reach out! You can ask on the mailing list or here, on GitHub, by opening a new issue or leaving a comment on a relevant issue that is already open.
                - paragraph [ref=e127]:
