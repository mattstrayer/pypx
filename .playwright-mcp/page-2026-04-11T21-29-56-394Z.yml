                  - text: or on Slack (write
                  - link "numpy-team@googlegroups.com" [ref=e127] [cursor=pointer]:
                    - /url: mailto:numpy-team@googlegroups.com
                  - text: for an invitation).
                - paragraph [ref=e128]: We also have a biweekly community call, details of which are announced on the mailing list. You are very welcome to join.
