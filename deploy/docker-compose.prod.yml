services:
  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  api:
    image: ghcr.io/mattstrayer/pypx/api:latest
    env_file: .env
    environment:
      - API_PORT=8080
      - SQLITE_PATH=/data/pypx.db
    volumes:
      - api_data:/data
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'

  web:
    image: ghcr.io/mattstrayer/pypx/web:latest
    environment:
      - NUXT_API_BASE=http://api:8080/api
      - NUXT_PUBLIC_API_BASE=/api
      # EthicalAds publisher ID for pypx.app — public, not a secret (it ships
      # in the served HTML). Set the variable to an explicit empty value in
      # /opt/pypx/.env to disable ads.
      - NUXT_PUBLIC_ADS_PUBLISHER=${NUXT_PUBLIC_ADS_PUBLISHER-pypxapp}
      - NUXT_PUBLIC_ADS_TYPE=${NUXT_PUBLIC_ADS_TYPE:-image}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

volumes:
  caddy_data:
  caddy_config:
  api_data:
