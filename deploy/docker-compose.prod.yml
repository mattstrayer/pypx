services:
  caddy:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  api:
    image: ghcr.io/mattstrayer/pypx/api:latest
    env_file: .env
    environment:
      - API_PORT=8080
      - SQLITE_PATH=/data/pypx.db
      # Soft heap limit below the 512M container limit, so the GC works harder
      # before the kernel kills the process. SQLite allocates outside the Go heap
      # and this limit does not see it: about 50 MiB at rest and over 130 MiB while
      # it stores a large docs entry. At 450MiB the sum reached 512M.
      - GOMEMLIMIT=300MiB
    volumes:
      - api_data:/data
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'

  web:
    image: ghcr.io/mattstrayer/pypx/web:latest
    environment:
      - NUXT_API_BASE=http://api:8080/api
      - NUXT_PUBLIC_API_BASE=/api
      # EthicalAds publisher ID for pypx.app — public, not a secret (it ships
      # in the served HTML). Set the variable to an explicit empty value in
      # /opt/pypx/.env to disable ads.
      - NUXT_PUBLIC_ADS_PUBLISHER=${NUXT_PUBLIC_ADS_PUBLISHER-pypxapp}
      - NUXT_PUBLIC_ADS_TYPE=${NUXT_PUBLIC_ADS_TYPE:-image}
      # Root app secret (32+ chars). nuxt-og-image derives its URL-signing key
      # from it; without it every OG image request returns 500 while pages
      # still render. `:?` makes compose refuse to start instead.
      # Generate with: openssl rand -hex 32
      - NUXT_APP_SECRET=${NUXT_APP_SECRET:?set NUXT_APP_SECRET (32+ chars) in /opt/pypx/.env}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

volumes:
  caddy_data:
  caddy_config:
  api_data:
