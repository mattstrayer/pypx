packages:
  - 'web'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true

# nuxt-og-image v6 lists sharp as an optional peer; we render OG images
# with @takumi-rs/core instead, so skip sharp to avoid its LGPL native
# libvips binaries (which fail the dependency-review license gate).
ignoredOptionalDependencies:
  - sharp

overrides:
  nuxt-site-config: '4.1.2'
  devalue: '5.9.0'
  js-cookie: '3.0.8'
  ws: '8.21.1'
  # GHSA-w7jw-789q-3m8p (CVSS 9.2): shell-quote <1.8.4, pulled transitively via
  # launch-editor (dev-only). Force the patched version.
  shell-quote: '1.10.0'
  # GHSA-gv7w-rqvm-qjhr (CVSS 8.1) + GHSA-g7r4-m6w7-qqqr (CVSS 2.5): esbuild
  # <0.28.1, pulled transitively via vite. Force the patched version.
  esbuild: '0.28.1'
  # GHSA-fx2h-pf6j-xcff (CVSS 8.2): vite <7.3.5, pulled transitively via
  # @nuxt/vite-builder (which requests ^7.3.3). Scoped so @nuxt/devtools'
  # separate vite 8.x stays untouched. Force the patched version.
  #
  # Must stay on 7.x. @nuxt/vite-builder 4.4.8 depends on vite ^7.3.3; on vite 8
  # it creates a WebSocket server for BOTH the client and SSR environments on the
  # same HMR path, so one browser handshake is upgraded twice and vite throws an
  # uncaughtException that kills `nuxt dev` on first page load. Reproduced on
  # 8.1.3 and 8.1.5. 7.3.5 is the patched version for this advisory, so closing it
  # never required major 8.
  '@nuxt/vite-builder>vite': '7.3.5'
  # GHSA-vmf3-w455-68vh (CVSS 6.9) + GHSA-r292-9mhp-454m (CVSS 5.3): tar
  # <7.5.21, pulled transitively. Force the patched version.
  tar: '7.5.22'
  # GHSA-3jxr-9vmj-r5cp (CVSS 7.7) + GHSA-mh99-v99m-4gvg (CVSS 7.5):
  # brace-expansion DoS. The second advisory is only fixed in 5.0.8, so every
  # earlier version is affected and both the 2.x and 5.x copies pulled in
  # transitively must be forced up to it.
  brace-expansion: '5.0.9'
  # GHSA-2p49-hgcm-8545 (CVSS 8.2): svgo <4.0.2, pulled transitively via
  # postcss-svgo. Force the patched version.
  svgo: '4.0.2'
  # GHSA-5qjj-4xww-7phc (CVSS 6.9): valibot <1.4.2, pulled transitively via
  # @nuxtjs/seo. Force the patched version.
  valibot: '1.4.2'
  # GHSA-v6wh-96g9-6wx3 (CVSS 5.5): launch-editor <2.14.1 (dev-only). Force the
  # patched version.
  launch-editor: '2.14.1'
  # GHSA-4x5r-pxfx-6jf8 (CVSS 3.2): @babel/core <7.29.6, pulled transitively.
  # Force the patched version.
  '@babel/core': '8.0.1'
  # vite-plugin-checker 0.14.3 (pulled transitively via @nuxt/vite-builder,
  # which requests ^0.14.1) was published <24h ago and trips pnpm's
  # minimumReleaseAge supply-chain gate. Pin to the newest in-range version
  # that clears the age window.
  vite-plugin-checker: '0.14.5'
