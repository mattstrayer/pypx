packages:
  - 'web'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true

# nuxt-og-image v6 lists sharp as an optional peer; we render OG images
# with @takumi-rs/core instead, so skip sharp to avoid its LGPL native
# libvips binaries (which fail the dependency-review license gate).
ignoredOptionalDependencies:
  - sharp

overrides:
  nuxt-site-config: '4.1.1'
  devalue: '5.8.1'
  js-cookie: '3.0.8'
  ws: '8.21.1'
  # GHSA-w7jw-789q-3m8p (CVSS 9.2): shell-quote <1.8.4, pulled transitively via
  # launch-editor (dev-only). Force the patched version.
  shell-quote: '1.10.0'
  # GHSA-gv7w-rqvm-qjhr (CVSS 8.1) + GHSA-g7r4-m6w7-qqqr (CVSS 2.5): esbuild
  # <0.28.1, pulled transitively via vite. Force the patched version.
  esbuild: '0.28.1'
  # GHSA-fx2h-pf6j-xcff (CVSS 8.2): vite <7.3.5, pulled transitively via
  # @nuxt/vite-builder (which requests ^7.3.3). Scoped so @nuxt/devtools'
  # separate vite 8.x stays untouched. Force the patched version.
  '@nuxt/vite-builder>vite': '8.1.3'
  # GHSA-vmf3-w455-68vh (CVSS 6.9): tar <7.5.16, pulled transitively. Force the
  # patched version.
  tar: '7.5.20'
  # GHSA-v6wh-96g9-6wx3 (CVSS 5.5): launch-editor <2.14.1 (dev-only). Force the
  # patched version.
  launch-editor: '2.14.1'
  # GHSA-4x5r-pxfx-6jf8 (CVSS 3.2): @babel/core <7.29.6, pulled transitively.
  # Force the patched version.
  '@babel/core': '8.0.1'
  # vite-plugin-checker 0.14.3 (pulled transitively via @nuxt/vite-builder,
  # which requests ^0.14.1) was published <24h ago and trips pnpm's
  # minimumReleaseAge supply-chain gate. Pin to the newest in-range version
  # that clears the age window.
  vite-plugin-checker: '0.14.4'
