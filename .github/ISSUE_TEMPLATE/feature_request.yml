name: Feature request
description: Suggest an idea or improvement for pypx
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Great. Open-ended discussions are usually a better fit for [Discussions](https://github.com/mattstrayer/pypx/discussions) — use this template when you have a concrete feature in mind.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: A clear description of the gap or pain point.
      placeholder: e.g. "When I'm comparing two packages, I can't see..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: The behavior or UI you'd like. Mockups, screenshots, or links to similar features elsewhere are very welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why they don't fit.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web frontend (Nuxt)
        - API (Go)
        - goopy (doc extractor)
        - Docker / deployment
        - Documentation
        - Cross-cutting / not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — links, related issues, prior discussions.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/mattstrayer/pypx/blob/main/CODE_OF_CONDUCT.md).
          required: true
