name: Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          LATEST="${LATEST:-v0.0.0}"
          LATEST="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev=v$LATEST" >> "$GITHUB_OUTPUT"
          echo "Deploying v$VERSION (${{ inputs.bump }} bump from v$LATEST)"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/mattstrayer/pypx/api:latest
            ghcr.io/mattstrayer/pypx/api:v${{ steps.version.outputs.version }}

      - name: Build and push Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/mattstrayer/pypx/web:latest
            ghcr.io/mattstrayer/pypx/web:v${{ steps.version.outputs.version }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DROPLET_SSH_KEY }}" >> ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Deploy to droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@$HOST"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          # Sync production configs
          $SCP deploy/docker-compose.prod.yml root@$HOST:/opt/pypx/docker-compose.yml
          $SCP Caddyfile root@$HOST:/opt/pypx/Caddyfile

          $SSH << 'DEPLOY'
            set -euo pipefail
            cd /opt/pypx

            # Pull latest images and recreate all services (including Caddy)
            docker compose pull
            docker compose up -d --remove-orphans --force-recreate

            # Wait for services to become healthy
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if docker compose exec -T api wget -q --spider http://localhost:8080/api/health 2>/dev/null; then
                echo "Deploy successful"


                exit 0
              fi
              sleep 2
            done
            echo "Health check failed after 60s"
            docker compose logs --tail=20
            exit 1
          DEPLOY

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@2778609c643a39a2576c4bae2e493b855eb4aee8 # v2.0.1

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"

          git tag "$VERSION"
          git push origin "$VERSION"

          NOTES=$(git-cliff --latest --strip header)

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES"
