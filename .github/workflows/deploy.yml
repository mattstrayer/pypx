name: Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev=v$LATEST" >> "$GITHUB_OUTPUT"
          echo "Deploying v$VERSION (${{ inputs.bump }} bump from v$LATEST)"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/mattstrayer/pypx/api:latest
            ghcr.io/mattstrayer/pypx/api:v${{ steps.version.outputs.version }}

      - name: Build and push Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/mattstrayer/pypx/web:latest
            ghcr.io/mattstrayer/pypx/web:v${{ steps.version.outputs.version }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$HOST"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # Sync production configs
          $SCP deploy/docker-compose.prod.yml root@$HOST:/opt/pypx/docker-compose.yml
          $SCP Caddyfile root@$HOST:/opt/pypx/Caddyfile

          $SSH << 'DEPLOY'
            set -euo pipefail
            cd /opt/pypx

            # Pull latest images and recreate all services (including Caddy)
            docker compose pull
            docker compose up -d --remove-orphans --force-recreate

            # Wait for services to become healthy
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sfk https://localhost/api/health > /dev/null 2>&1; then
                echo "Deploy successful"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed after 60s"
            docker compose logs --tail=20
            exit 1
          DEPLOY

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"

          git tag "$VERSION"
          git push origin "$VERSION"

          NOTES=$(git-cliff --latest --strip header)

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES"
