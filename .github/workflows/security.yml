name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [api, goopy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm-lock.yaml is checked by the pnpm-audit job instead. GitHub's OSV
      # export cannot express an upper bound on an advisory range that has
      # no fixed version, so it emits an open range and osv-scanner flags
      # patched releases (four Nuxt advisories in 2026:
      # github/advisory-database#470). pnpm audit reads GitHub's ranges
      # directly. Every other lockfile, including ones added later, stays here.
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --recursive
            --x-disable-plugins=javascript/pnpmlock
            ./

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      # Reads pnpm-lock.yaml; no install needed.
      - name: Run pnpm audit
        run: pnpm audit

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # BlueOak-1.0.0 is a permissive model license (MIT-like), used by
          # isaacs' packages (tar, lru-cache, minimatch, ...).
          # golang.org/x/* modules are BSD-3-Clause + Go's PATENTS file, which is
          # reported as the compound expression
          # "BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang".
          # The patent grant is permissive. OFL-1.1 (SIL Open Font License)
          # covers fonts bundled in packages such as chroma/v3; it permits use,
          # embedding and redistribution. Allow these licenses rather than
          # listing packages one at a time, so the next module that ships under
          # them does not fail this gate.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0,
            Unlicense, 0BSD, CC0-1.0, Python-2.0, BlueOak-1.0.0,
            LicenseRef-scancode-google-patent-license-golang, OFL-1.1
          # caniuse-lite ships under CC-BY-4.0 (attribution-only, no share-alike):
          # it is browser-usage data consumed by browserslist, not linked code.
          # Already a transitive dependency on main; allow it explicitly.
          allow-dependencies-licenses: 'pkg:npm/caniuse-lite'
          comment-summary-in-pr: on-failure
