name: goopy ecosystem parity

on:
  schedule:
    # Weekly on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: goopy-ecosystem
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: goopy/go.mod
          cache-dependency-path: goopy/go.sum

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.6'

      - name: Install griffe and httpx
        run: pip install 'griffe>=2,<3' 'httpx>=0.28,<1'

      - name: Run extraction smoke test (60 packages)
        working-directory: goopy
        run: go test ./internal/ecosystem/ -run TestExtraction -count=1 -timeout 300s -v

      - name: Run parity test against griffe (60 packages)
        working-directory: goopy
        run: go test ./internal/ecosystem/ -run TestParity -count=1 -timeout 1800s -v

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: goopy/go.mod
          cache-dependency-path: goopy/go.sum

      - name: Run unit tests
        working-directory: goopy
        run: go test ./... -short -count=1 -race

      - name: Check coverage
        working-directory: goopy
        run: |
          go test ./... -short -coverprofile=coverage.out -count=1
          go tool cover -func=coverage.out | tail -1
