name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Default to read-only; the label step elevates only what it needs.
permissions:
  contents: read

jobs:
  label:
    name: Apply path-based labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0 # Renovate will pin to SHA on first scan
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
