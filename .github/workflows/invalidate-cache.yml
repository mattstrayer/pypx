name: Invalidate Cache

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 'Cache key prefix to purge (e.g. "stats:" or "%" for all)'
        required: true
        default: 'stats:'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  invalidate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DROPLET_SSH_KEY }}" >> ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Validate prefix input
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          # Allow only safe characters for SQL LIKE patterns: alnum, ':', '_', '-', '%'.
          # Rejects shell metacharacters and quote injection before we hand the value to ssh/sqlite.
          if ! printf '%s' "$PREFIX" | grep -Eq '^[A-Za-z0-9:_%-]{1,64}$'; then
            echo "Invalid prefix: must match ^[A-Za-z0-9:_%-]{1,64}$" >&2
            exit 1
          fi

      - name: Purge cache entries
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@$HOST"

          # Write a self-contained purge script to avoid quoting hell across
          # GitHub Actions → SSH → docker → sh layers.
          cat > /tmp/purge.sh << 'SCRIPT'
          #!/bin/sh
          set -eu
          apk add --no-cache sqlite > /dev/null 2>&1
          BEFORE=$(sqlite3 /data/pypx.db "SELECT count(*) FROM cache WHERE key LIKE '${1}%'")
          sqlite3 /data/pypx.db "DELETE FROM cache WHERE key LIKE '${1}%'"
          echo "Purged $BEFORE cache entries matching '${1}%'"
          SCRIPT
          chmod +x /tmp/purge.sh

          # Copy script to droplet and run inside a temporary container
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new /tmp/purge.sh root@$HOST:/tmp/purge.sh
          $SSH "docker run --rm -v pypx_api_data:/data -v /tmp/purge.sh:/purge.sh alpine:3.20 sh /purge.sh '$PREFIX'"
