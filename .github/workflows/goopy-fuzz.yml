name: goopy fuzz

on:
  schedule:
    # Nightly at 04:00 UTC — offset from the weekly ecosystem run (Sundays 06:00).
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: goopy-fuzz
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./lexer
            target: FuzzLex
          - pkg: ./parser
            target: FuzzParse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: goopy/go.mod
          cache-dependency-path: goopy/go.sum

      - name: Fuzz ${{ matrix.target }} (5m)
        working-directory: goopy
        run: go test ${{ matrix.pkg }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 5m

      # go test -fuzz writes crashers to <pkg>/testdata/fuzz/<FuzzName>/ in the
      # checkout. This workflow has read-only contents permission (Scorecard
      # posture), so crashers are uploaded as an artifact; a maintainer commits
      # them as permanent regression seeds.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: goopy/*/testdata/fuzz/**
          if-no-files-found: ignore
