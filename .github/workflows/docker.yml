name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tags=" >> "$GITHUB_OUTPUT"
          else
            SHORT=$(git rev-parse --short=7 HEAD)
            {
              echo "tags<<EOF"
              echo "ghcr.io/mattstrayer/pypx/${{ matrix.service }}:main"
              echo "ghcr.io/mattstrayer/pypx/${{ matrix.service }}:sha-${SHORT}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          load: true
          tags: pypx-scan/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Blocks the PR, and stops main from publishing the image, on a fixable
      # high or critical vulnerability. This uses table output because the action
      # drops the severity filter for SARIF. The trivy job below reports everything.
      - name: Trivy gate
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: pypx-scan/${{ matrix.service }}:ci
          format: table
          scanners: vuln
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate app secret
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "NUXT_APP_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Build and start stack
        run: |
          docker compose --profile prod build
          docker compose --profile prod up -d

      - name: Wait for health
        run: |
          set -euo pipefail
          # Caddy serves localhost with `tls internal`, so plain http only
          # returns a 308 to https (which curl -f accepts). Hit https with -k
          # so these checks reach the API and Nuxt, not just Caddy.
          for i in $(seq 1 30); do
            if curl -fsSk https://localhost/api/health >/dev/null \
               && curl -fsSk https://localhost/ >/dev/null; then
              echo "Stack healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "Stack failed to become healthy"
          docker compose --profile prod ps
          docker compose --profile prod logs --tail=200
          exit 1

      # A broken OG renderer (missing secret, renderer or font regression)
      # still serves every page with a 200, so check the image itself.
      - name: Render OG image
        run: |
          set -euo pipefail
          og=$(curl -fsSk https://localhost/ | grep -oE '<meta property="og:image" content="[^"]+"' | head -1 | sed -E 's/.*content="([^"]+)"/\1/' || true)
          test -n "$og" || { echo "no og:image on /"; exit 1; }
          url="https://localhost/${og#https://*/}"
          type=$(curl -fsSk -o /dev/null -w '%{content_type}' "$url") || {
            echo "OG image request failed: $url"
            docker compose --profile prod logs --tail=50 web
            exit 1
          }
          test "$type" = "image/png" || { echo "OG image returned $type"; exit 1; }
          echo "OG image ok: $url"

      - name: Tear down
        if: always()
        run: docker compose --profile prod down -v

  trivy:
    name: trivy (${{ matrix.service }})
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: ghcr.io/mattstrayer/pypx/${{ matrix.service }}:main
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
